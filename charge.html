<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElevenPayCharge</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f6f9; margin: 0; }
    .container { max-width: 440px; margin: 0 auto; }
    .card { background: white; padding: 35px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 10px; }
    h1, h2, h3 { color: #333; margin-top: 0; }
    
    .main-btn { width: 100%; padding: 18px; font-size: 18px; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; background: #007bff; margin-top: 15px; }
    .insert-btn { background: #28a745; font-size: 20px; padding: 20px; } /* 投入完了ボタン */
    .secondary-btn { width: 100%; padding: 14px; font-size: 16px; color: #333; border: 1px solid #ccc; border-radius: 12px; cursor: pointer; font-weight: bold; background: #f8f9fa; margin-top: 10px; }
    
    .amount-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
    .amount-btn { padding: 18px 10px; background: #f8f9fa; border: 2px solid #007bff; color: #007bff; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
    .amount-btn.other { border-color: #6c757d; color: #555; }

    input { width: 100%; padding: 14px; font-size: 24px; border: 2px solid #ddd; border-radius: 12px; text-align: center; font-weight: bold; margin-top: 15px; }
    .hidden { display: none; }
    
    .confirm-box { background: #eef5ff; border: 2px dashed #007bff; padding: 20px; border-radius: 12px; margin: 20px 0; }
    .confirm-amount { font-size: 32px; font-weight: bold; color: #007bff; margin-top: 10px; }

    .cash-guide { background: #fff3cd; border: 2px solid #ffeeba; color: #856404; padding: 20px; border-radius: 12px; margin: 20px 0; }
    .arrow-right { font-size: 40px; margin: 10px 0; animation: bounce 1s infinite alternate; }
    @keyframes bounce { 0% { transform: translateX(-10px); } 100% { transform: translateX(10px); } }

    .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .pop-anim { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    
    <!-- 1. トップ画面（始める） -->
    <div id="start-view">
      <h1>チャージ専用機</h1>
      <p style="color: #666; font-size: 14px;">現金チャージはこちら</p>
      <button class="main-btn" onclick="startCharge()" style="font-size: 22px; padding: 22px;">チャージを始める</button>
    </div>

    <!-- 2. 金額選択画面 -->
    <div id="button-view" class="hidden">
      <h2>金額を選択</h2>
      <div class="amount-grid">
        <button class="amount-btn" onclick="selectPresetAmount(1000)">1,000円</button>
        <button class="amount-btn" onclick="selectPresetAmount(2000)">2,000円</button>
        <button class="amount-btn" onclick="selectPresetAmount(3000)">3,000円</button>
        <button class="amount-btn" onclick="selectPresetAmount(5000)">5,000円</button>
      </div>
      <button class="amount-btn other" style="width: 100%; margin-top: 12px;" onclick="openCustomInput()">その他（直接入力）</button>
      <button class="secondary-btn" onclick="resetToStart()">戻る</button>
    </div>

    <!-- 2-B. その他（手入力）画面 -->
    <div id="custom-view" class="hidden">
      <h2>金額を入力</h2>
      <input type="number" id="charge-amount" placeholder="">
      <button class="main-btn" onclick="submitCustomAmount()">次へ</button>
      <button class="secondary-btn" onclick="backToButtonView()">戻る</button>
    </div>

    <!-- 3. 金額確認画面 -->
    <div id="confirm-view" class="hidden">
      <h2>チャージ金額</h2>
      <div class="confirm-box">
        <div style="font-size: 14px; color: #555;">チャージ金額</div>
        <div id="confirm-display" class="confirm-amount">0円</div>
      </div>
      <button class="main-btn" onclick="goToCashView()">次へ</button>
      <button class="secondary-btn" onclick="backToButtonView()">戻る</button>
    </div>

    <!-- 4. お金投入案内画面 -->
    <div id="cash-view" class="hidden">
      <h2>現金の投入</h2>
      <div class="cash-guide">
        <div style="font-size: 18px; font-weight: bold;">右の投入口に現金を入れてください</div>
      </div>
      <button class="main-btn insert-btn" onclick="startProcessing()">投入完了</button>
      <button class="secondary-btn" onclick="backToButtonView()">戻る</button>
    </div>

    <!-- 5. 確認中... -->
    <div id="processing-view" class="hidden">
      <div class="spinner"></div>
      <div style="font-size: 20px; font-weight: bold;">確認中...</div>
      <p style="color: #666; font-size: 14px;">しばらくお待ちください</p>
    </div>

    <!-- 6. QRコード表示 -->
    <div id="qr-view" class="hidden">
      <h3 id="qr-label" style="color: #007bff;"></h3>
      <div id="qrcode" class="pop-anim" style="margin: 20px auto; display: flex; justify-content: center;"></div>
      <p style="color: #666; font-size: 14px;">スマホアプリで読み取ってください</p>
      <button class="secondary-btn" onclick="resetToStart()">完了</button>
    </div>

  </div>
</div>

<script>
  let tempAmount = 0;

  function startCharge() {
    document.getElementById("start-view").classList.add("hidden");
    document.getElementById("button-view").classList.remove("hidden");
  }

  function selectPresetAmount(amount) {
    tempAmount = amount;
    showConfirmScreen();
  }

  function openCustomInput() {
    document.getElementById("charge-amount").value = "";
    document.getElementById("button-view").classList.add("hidden");
    document.getElementById("custom-view").classList.remove("hidden");
  }

  function submitCustomAmount() {
    const inputVal = document.getElementById("charge-amount").value;
    tempAmount = parseInt(inputVal);
    if (!tempAmount || tempAmount <= 0) return alert("金額を入力してください");
    showConfirmScreen();
  }

  // 金額確認画面を表示
  function showConfirmScreen() {
    document.getElementById("button-view").classList.add("hidden");
    document.getElementById("custom-view").classList.add("hidden");
    document.getElementById("confirm-display").innerText = `${tempAmount.toLocaleString()}円`;
    document.getElementById("confirm-view").classList.remove("hidden");
  }

  // お金投入案内画面へ進む
  function goToCashView() {
    document.getElementById("confirm-view").classList.add("hidden");
    document.getElementById("cash-view").classList.remove("hidden");
  }

  function backToButtonView() {
    document.getElementById("custom-view").classList.add("hidden");
    document.getElementById("confirm-view").classList.add("hidden");
    document.getElementById("cash-view").classList.add("hidden");
    document.getElementById("button-view").classList.remove("hidden");
  }

  // 「投入完了」押下 ➔ 確認中... ➔ QR表示
  function startProcessing() {
    document.getElementById("cash-view").classList.add("hidden");
    document.getElementById("processing-view").classList.remove("hidden");

    setTimeout(() => {
      document.getElementById("processing-view").classList.add("hidden");
      document.getElementById("qr-view").classList.remove("hidden");
      document.getElementById("qr-label").innerText = `チャージ: ${tempAmount.toLocaleString()}円`;

      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";
      
      qrContainer.classList.remove('pop-anim');
      void qrContainer.offsetWidth; 
      qrContainer.classList.add('pop-anim');

      new QRCode(qrContainer, {
        text: "CHARGE_" + tempAmount,
        width: 200,
        height: 200
      });
    }, 2500);
  }

  function resetToStart() {
    tempAmount = 0;
    document.getElementById("charge-amount").value = "";
    document.getElementById("start-view").classList.remove("hidden");
    document.getElementById("button-view").classList.add("hidden");
    document.getElementById("custom-view").classList.add("hidden");
    document.getElementById("confirm-view").classList.add("hidden");
    document.getElementById("cash-view").classList.add("hidden");
    document.getElementById("processing-view").classList.add("hidden");
    document.getElementById("qr-view").classList.add("hidden");
  }
</script>

</body>
</html>
