<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChargeElevenPay</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f6f9; margin: 0; }
    .container { max-width: 440px; margin: 0 auto; }
    
    .card { background: white; padding: 35px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 10px; }
    h1 { color: #007bff; font-size: 26px; margin-top: 0; margin-bottom: 25px; font-weight: bold; }
    
    /* 1. 選択画面 */
    .quick-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .quick-btn { 
      padding: 24px 10px; 
      background: #f0f4f8; 
      border: 3px solid #cce5ff; 
      color: #007bff; 
      border-radius: 16px; 
      font-weight: bold; 
      font-size: 22px; 
      cursor: pointer;
      transition: background 0.2s;
    }
    .quick-btn:active { background: #d0e4ff; }

    #custom-input-area { display: none; margin-bottom: 20px; background: #f8f9fa; padding: 20px; border-radius: 16px; border: 1px solid #eee; }
    label { display: block; font-size: 15px; color: #555; margin-bottom: 10px; font-weight: bold; }
    input { width: 100%; padding: 15px; font-size: 24px; border: 2px solid #ddd; border-radius: 12px; text-align: center; font-weight: bold; }
    
    .main-btn { width: 100%; padding: 16px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 15px; }
    
    /* 2. 確認画面 */
    #confirm-view { display: none; }
    .confirm-text { font-size: 18px; color: #333; font-weight: bold; margin-bottom: 15px; }
    .confirm-amount { font-size: 40px; color: #007bff; font-weight: bold; margin: 15px 0 25px 0; }
    .confirm-btn-group { display: flex; gap: 10px; }
    .cancel-btn { flex: 1; padding: 16px; background: #6c757d; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; }
    .ok-btn { flex: 1.5; padding: 16px; background: #007bff; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; }

    /* 3. QR表示画面 */
    #qr-view { display: none; }
    #qrcode { margin: 25px auto; display: flex; justify-content: center; }
    .qr-badge { font-size: 24px; color: #007bff; font-weight: bold; margin-bottom: 20px; }
    .reset-btn { width: 100%; padding: 16px; background: #6c757d; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>チャージ専用機</h1>

    <!-- 1. 金額選択画面 -->
    <div id="select-view">
      <div class="quick-buttons">
        <button class="quick-btn" onclick="askConfirmation(1000)">1,000円</button>
        <button class="quick-btn" onclick="askConfirmation(3000)">3,000円</button>
        <button class="quick-btn" onclick="askConfirmation(5000)">5,000円</button>
        <button class="quick-btn" onclick="showCustomInput()">その他</button>
      </div>

      <div id="custom-input-area">
        <label>金額を入力（1,000円単位）</label>
        <input type="number" id="custom-amount" placeholder="例: 2000" step="1000">
        <button class="main-btn" onclick="submitCustomAmount()">次へ進む</button>
      </div>
    </div>

    <!-- 2. 確認画面 -->
    <div id="confirm-view">
      <div class="confirm-text">こちらの金額でチャージしますか？</div>
      <div class="confirm-amount" id="display-confirm-amount">0円</div>
      <div class="confirm-btn-group">
        <button class="cancel-btn" onclick="resetToStart()">戻る</button>
        <button class="ok-btn" onclick="generateAndShowQR()">はい</button>
      </div>
    </div>

    <!-- 3. QRコード表示画面 -->
    <div id="qr-view">
      <div class="qr-badge" id="qr-status"></div>
      <div id="qrcode"></div>
      <p style="color: #666; font-size: 15px;">スマホアプリで読み取ってください</p>
      <button class="reset-btn" onclick="resetToStart()">最初に戻る</button>
    </div>

  </div>
</div>

<script>
  let selectedAmount = 0;
  let qrcode = new QRCode(document.getElementById("qrcode"), {
    width: 220,
    height: 220
  });

  function showCustomInput() {
    document.getElementById("custom-input-area").style.display = "block";
  }

  function submitCustomAmount() {
    let amount = parseInt(document.getElementById("custom-amount").value);

    if (!amount || amount <= 0) {
      alert("金額を入力してください");
      return;
    }

    if (amount % 1000 !== 0) {
      alert("チャージは1,000円単位でしかできません");
      return;
    }

    askConfirmation(amount);
  }

  // 金額を選んだら確認画面を表示する
  function askConfirmation(amount) {
    selectedAmount = amount;
    document.getElementById("display-confirm-amount").innerText = `${amount.toLocaleString()} 円`;
    
    document.getElementById("select-view").style.display = "none";
    document.getElementById("confirm-view").style.display = "block";
  }

  // 「はい（発行）」を押した時に初めてQRコードを生成
  function generateAndShowQR() {
    let qrData = "CHARGE_" + selectedAmount;
    qrcode.makeCode(qrData);

    document.getElementById("qr-status").innerText = `チャージ額: ${selectedAmount.toLocaleString()}円`;
    
    document.getElementById("confirm-view").style.display = "none";
    document.getElementById("qr-view").style.display = "block";
  }

  // 最初に戻る・やり直す
  function resetToStart() {
    selectedAmount = 0;
    document.getElementById("custom-amount").value = "";
    document.getElementById("custom-input-area").style.display = "none";
    document.getElementById("confirm-view").style.display = "none";
    document.getElementById("qr-view").style.display = "none";
    document.getElementById("select-view").style.display = "block";
  }
</script>

</body>
</html>
